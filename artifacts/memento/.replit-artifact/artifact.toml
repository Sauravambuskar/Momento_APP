kind = "mobile"
previewPath = "/"
title = "Memento — My Life in Weeks"
version = "1.0.0"
id = "artifacts/memento"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 18771

[services.development]
run = "pnpm --filter @workspace/memento run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memento", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/memento", "run", "serve" ]

[services.env]
PORT = "18771"
BASE_PATH = "/"
